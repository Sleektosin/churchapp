<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9; color: #0f172a;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
            box-shadow: 0 12px 24px -8px rgba(15,23,42,.12); padding: 48px 40px;
            max-width: 480px; width: 100%; text-align: center;
        }
        .icon {
            width: 88px; height: 88px; border-radius: 50%;
            background: rgba(239,68,68,.1); color: #ef4444;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 40px; margin-bottom: 24px;
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; }
        p { color: #475569; margin-bottom: 28px; line-height: 1.6; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: .7rem 1.4rem; border-radius: 12px; font-weight: 600; text-decoration: none;
            display: inline-flex; align-items: center; gap: .5rem; border: none; cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg,#4f46e5,#4338ca); color: #fff; }
        .btn-outline { background: #fff; color: #475569; border: 2px solid #e2e8f0; }
        .code { font-size: .8rem; color: #94a3b8; margin-top: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-lock"></i></div>
        <h1>Access Denied</h1>
        <p>You don't have permission to view this page or perform this action. If you believe this is a mistake, please contact an administrator.</p>
        <div class="actions">
            <a href="{{ url_for('views.home') }}" class="btn btn-primary"><i class="fas fa-house"></i> Go Home</a>
            <a href="javascript:history.back()" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Go Back</a>
        </div>
        <div class="code">ERROR 403 · FORBIDDEN</div>
    </div>
</body>
</html>
