<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      :root {
        --primary-color: #4a6bff;
        --secondary-color: #f5f7ff;
        --text-color: #333;
        --light-gray: #f0f0f0;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      body {
        background-color: var(--secondary-color);
      }
      
      .register-container {
        max-width: 100%;
        padding: 20px;
      }
      
      .register-card {
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      
      .register-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      
      .register-form {
        padding: 30px;
      }
      
      .form-control {
        height: 50px;
        border-radius: 8px;
        border: 1px solid #ddd;
        padding-left: 15px;
        font-size: 16px;
        margin-bottom: 15px;
      }
      
      .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: none;
      }
      
      select.form-control {
        height: 50px;
        padding-top: 0;
        padding-bottom: 0;
      }
      
      .btn-register {
        background-color: var(--primary-color);
        color: white;
        border: none;
        height: 50px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s;
        width: 100%;
      }
      
      .btn-register:hover {
        background-color: #3a5bef;
        transform: translateY(-2px);
      }
      
      .register-links {
        margin-top: 20px;
        text-align: center;
      }
      
      .register-links a {
        color: var(--primary-color);
        text-decoration: none;
      }
      
      .register-links a:hover {
        text-decoration: underline;
      }
      
      .alert {
        border-radius: 8px;
        padding: 10px 15px;
        margin-bottom: 20px;
      }
      
      .form-check-label {
        margin-left: 5px;
      }
      
      .form-check-input {
        width: 18px;
        height: 18px;
        margin-top: 5px;
      }
      
      /* Responsive adjustments */
      @media (min-width: 992px) {
        .register-container {
          padding-top: 40px;
          max-width: 1200px;
          margin: 0 auto;
        }
        
        .register-card {
          display: flex;
          min-height: 800px;
        }
        
        .register-image-col {
          flex: 0 0 45%;
          max-width: 45%;
        }
        
        .register-image {
          border-radius: 15px 0 0 15px;
        }
        
        .register-form-col {
          flex: 0 0 55%;
          max-width: 55%;
          padding: 40px;
        }
        
        .form-columns {
          display: flex;
          gap: 20px;
        }
        
        .form-column {
          flex: 1;
        }
      }
      
      @media (max-width: 991px) {
        .register-image {
          border-radius: 15px 15px 0 0;
          height: 300px;
        }
        
        .register-form {
          padding: 25px;
        }
        
        .form-columns {
          display: block;
        }
      }
      
      @media (max-width: 767px) {
        .register-container {
          padding: 15px;
        }
        
        .register-form {
          padding: 20px;
        }
      }
      
      .form-section-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--primary-color);
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="register-image-col">
          <img
            src="{{url_for('static',filename = 'uploads/register_2.jpg')}}"
            alt="Register"
            class="register-image"
          />
        </div>
        <div class="register-form-col">
          <div class="register-form">
            <h2 class="mb-4">Create Your Account</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert">
                      <span aria-hidden="true">&times;</span>
                    </button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            
            <form method="post" action="">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
              
              <div class="form-columns">
                <div class="form-column">
                  <div class="form-section-title">Personal Information</div>
                  
                  <input
                    type="text"
                    placeholder="Username"
                    name="username"
                    id="username"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="text"
                    placeholder="First Name"
                    name="firstname"
                    id="firstname"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="text"
                    placeholder="Last Name"
                    name="lastname"
                    id="lastname"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="date"
                    placeholder="Date of Birth"
                    name="date_of_birth"
                    id="date_of_birth"
                    class="form-control"
                  />
                  
                  <select id="gender" class="form-control" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                  </select>
                  
                  <div class="form-check mt-2 mb-3">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      name="is_first_timer"
                      id="is_first_timer"
                      checked
                    />
                    <label class="form-check-label" for="is_first_timer">
                      First time user?
                    </label>
                  </div>
                </div>
                
                <div class="form-column">
                  <div class="form-section-title">Account Details</div>
                  
                  <input
                    type="text"
                    placeholder="Phone Number"
                    name="phone_no"
                    id="phone_no"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="text"
                    placeholder="Home Address"
                    name="home_address"
                    id="home_address"
                    class="form-control"
                  />
                  
                  <input
                    type="password"
                    placeholder="Password"
                    name="password1"
                    id="password1"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="password"
                    placeholder="Confirm Password"
                    name="password2"
                    id="password2"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="email"
                    placeholder="Email Address"
                    name="email"
                    id="email"
                    class="form-control"
                    required
                  />
                  
                  <input
                    type="date"
                    placeholder="Date joined (MM-DD-YYYY)"
                    name="date_joined"
                    id="date_joined"
                    value="{{ current_time }}"
                    class="form-control date-input"
                    onfocus="(this.type='date')"
                    onblur="if(!this.value)this.type='text'"
                  />
                </div>
              </div>
              
              <button type="submit" class="btn btn-register mt-3">
                Create Account
              </button>
              
              <div class="register-links">
                <a href="{{url_for('views.login')}}">Already have an account? Sign in</a><br>
                <a href="{{url_for('views.forgotpassword')}}">Forgot Password?</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
