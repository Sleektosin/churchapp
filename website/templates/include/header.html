<header class="sticky-top shadow-sm" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05);">
    <nav class="navbar navbar-expand-lg navbar-light px-4 py-2">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <div class="bg-primary d-flex align-items-center justify-content-center rounded-3 me-2" style="width: 35px; height: 35px;">
                    <img src="{{ url_for('static', filename='uploads/logo-icon.png') }}" alt="logo" width="22" />
                </div>
                <span class="fw-bold tracking-tight text-slate-800" style="font-size: 1.1rem; letter-spacing: -0.5px;">SleekTech Solution</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#headerNav">
                <i class="fas fa-bars"></i>
            </button>

            <div class="collapse navbar-collapse" id="headerNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-slate-500 hover:text-blue-600 px-3" href="javascript:void(0)" id="sidebarCollapse">
                            <i class="fa-solid fa-bars-staggered"></i>
                        </a>
                    </li>
                    <li class="nav-item d-none d-md-block ms-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control border-0 bg-light" placeholder="Global search..." style="width: 250px;">
                        </div>
                    </li>
                </ul>

                <ul class="navbar-nav align-items-center">
                    <li class="nav-item dropdown me-2">
                        <a class="nav-link position-relative text-slate-600" href="#" id="notifDropdown" data-bs-toggle="dropdown">
                            <i class="fa-regular fa-bell fs-5"></i>
                            <span class="position-absolute top-1 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                                3
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-2 rounded-4 animated slideIn">
                            <li><h6 class="dropdown-header">Notifications</h6></li>
                            <li><a class="dropdown-item rounded-3 py-2" href="#"><small>Event starting today</small></a></li>
                            <li><a class="dropdown-item rounded-3 py-2 text-primary" href="#"><small>View all</small></a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link d-flex align-items-center gap-2 p-1 pe-3 rounded-pill hover:bg-light" href="#" id="profileDropdown" data-bs-toggle="dropdown">
                            <img src="{{ url_for('static', filename='uploads/users/1.jpg') }}" class="rounded-circle border border-2 border-white shadow-sm" width="35" height="35" alt="user">
                            <div class="d-none d-lg-block">
                                <p class="mb-0 fw-semibold text-slate-800" style="font-size: 0.85rem;">{{ current_user.username if current_user.is_authenticated else 'Guest User' }}</p>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-2 rounded-4 mt-2">
                            <li>
                                <a class="dropdown-item rounded-3 d-flex align-items-center py-2" href="{{ url_for('views.userdetails', id=current_user.id) if current_user.is_authenticated else '#' }}">
                                    <i class="fa-regular fa-circle-user me-2 text-muted"></i> My Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item rounded-3 d-flex align-items-center py-2" href="#">
                                    <i class="fa-solid fa-gear me-2 text-muted"></i> Settings
                                </a>
                            </li>
                            <li><hr class="dropdown-divider opacity-50"></li>
                            <li>
                                <a class="dropdown-item rounded-3 d-flex align-items-center py-2 text-danger" href="{{ url_for('views.logout') }}">
                                    <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<script>
{% if current_user.is_authenticated %}
window.addEventListener('beforeunload', function() {
    navigator.sendBeacon("{{ url_for('views.silent_logout') }}");
});
{% endif %}
</script>
