<style>
    /*
     * Z-INDEX LADDER (matches leftnavbar.html — do not change):
     *   Page content  : 0
     *   Header        : 1030
     *   Overlay       : 1040
     *   Sidebar       : 1045
     */
    .app-header {
        position: sticky;
        top: 0;
        z-index: 1030;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0,0,0,0.06);
        box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    }

    .app-header .navbar {

        min-height: 60px;
    }

    .navbar-brand {

        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
    }

    .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #3b82f6;
        display: flex;
        align-items: center;
        justify-content: center;

    .brand-name {

        font-size: 1.05rem;
        color: #1e293b;

        white-space: nowrap;

        text-overflow: ellipsis;

    @media (min-width: 992px) {

    }

    @media (max-width: 400px) {

    }
</style>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Back button: return to the previous page, or Home if there's no history.
    var backButton = document.getElementById('backButton');
    if (backButton) {
        backButton.addEventListener('click', function () {
            if (window.history.length > 1 && document.referrer) {
                window.history.back();
            } else {
                window.location.href = backButton.getAttribute('data-home');
            }
        });
    }

    var toggle  = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('mainSidebar');
    var overlay = document.getElementById('sidebarOverlay');

    if (!toggle || !sidebar || !overlay) return;

    function openSidebar() {
        sidebar.classList.add('show');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
        sidebar.classList.remove('show');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    toggle.addEventListener('click', function () {
        sidebar.classList.contains('show') ? closeSidebar() : openSidebar();
    });

    overlay.addEventListener('click', closeSidebar);

    function handleDesktopView() {
        if (window.innerWidth > 991) {
            // On desktop, ensure sidebar is closed (CSS will show it via transform)
            if (sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
            }
            if (overlay.classList.contains('show')) {
                overlay.classList.remove('show');
            }
            document.body.style.overflow = '';
        }
    }
    
    // Handle resize events
    window.addEventListener('resize', function () {
        if (window.innerWidth > 991) {
            closeSidebar();
        }
        handleDesktopView();
    });
    
    // Initial check
    handleDesktopView();

    if (sidebar) {
        sidebar.querySelectorAll('a.sidebar-link:not([data-bs-toggle])').forEach(function (link) {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 991) closeSidebar();
            });
        });
    }

});
</script>

<!-- Idle auto-logout: signs the user out client-side after inactivity.
     Kept in sync with the server-side PERMANENT_SESSION_LIFETIME. -->
<script>
(function () {
    // Minutes of inactivity before auto-logout (matches server session lifetime)
    var IDLE_LIMIT_MINUTES = 30;
    var WARN_BEFORE_SECONDS = 30;

    var logoutUrl = "{{ url_for('views.logout') }}";
    var idleMs = IDLE_LIMIT_MINUTES * 60 * 1000;
    var warnMs = idleMs - (WARN_BEFORE_SECONDS * 1000);
    var idleTimer, warnTimer;

    function logoutNow() {
        window.location.href = logoutUrl;
    }

    function showWarning() {
        // Lightweight, dependency-free warning banner
        if (document.getElementById('idleWarningBar')) return;
        var bar = document.createElement('div');
        bar.id = 'idleWarningBar';
        bar.setAttribute('role', 'alert');
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:20000;background:#f59e0b;' +
            'color:#1e293b;font-weight:600;text-align:center;padding:10px 16px;font-family:Inter,Arial,sans-serif;' +
            'box-shadow:0 2px 10px rgba(0,0,0,.15);';
        bar.textContent = 'You will be signed out shortly due to inactivity. Move your mouse or press a key to stay signed in.';
        document.body.appendChild(bar);
    }

    function clearWarning() {
        var bar = document.getElementById('idleWarningBar');
        if (bar) bar.remove();
    }

    function resetTimers() {
        clearTimeout(idleTimer);
        clearTimeout(warnTimer);
        clearWarning();
        warnTimer = setTimeout(showWarning, warnMs);
        idleTimer = setTimeout(logoutNow, idleMs);
    }

    var activityEvents = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'];
    activityEvents.forEach(function (evt) {
        window.addEventListener(evt, resetTimers, { passive: true });
    });

    resetTimers();
})();
</script>
